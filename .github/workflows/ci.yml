# Runner pin: jobs use ubuntu-24.04, not ubuntu-latest. ubuntu-latest now
# resolves to Ubuntu 26.04, where the Playwright chromium install and the
# Pa11y browser launch fail. Revisit once Playwright supports 26.04.

# Continuous integration.
#
# Action versions were verified against GitHub and pinned to commit SHAs
# on 2026-05-21. The version tag is shown in the trailing comment. To
# update an action, change the SHA and the comment together.
#
# Stack selection is automatic, by manifest file, not a manual switch:
#   - a package.json at the repository root runs the static front-end
#     (npm) block — the default stack across the estate.
#   - a composer.json at the repository root runs the Composer block,
#     which covers both the PHP-MariaDB stack and the WordPress stack,
#     since both use the same composer install / analyse / test commands
#     (see docs/stacks/php-mariadb.md and docs/stacks/wordpress.md).
# A project can have both manifests; both blocks then run.
#
# .github/ci-archetype: a required, single-line declaration file for a
# code-type project that has neither manifest — a hand-written static site
# with no package.json and no build step. Its contents (trimmed of
# whitespace) must be one of: static-content, static-app, browser-extension,
# php, python-tool, wordpress-theme. Only "static-content", "python-tool",
# and "wordpress-theme" excuse a project from the no-manifest failure below;
# the other values exist so the file is a complete, self-documenting record
# of the project's archetype even where a manifest already tells CI what to
# do. See jacob-ci-archetypes.md section 2b.
# A project with neither a manifest nor an excusing declaration fails the
# job, because a code-type project is expected to have one or the other.
#
# python-tool: a Python command-line tool or automation script with no
# web-facing surface at all (no package.json, no composer.json, no HTML, no
# CSS). Instead of the npm/Composer blocks above, this archetype gets a
# genuine Python compile check (see below). First introduced as a
# project-local fix in Lire RSS Hermes
# (docs/decisions/001-python-tool-ci-archetype.md in that project) and
# upstreamed here.
#
# wordpress-theme: a classic WordPress theme with PHP templates, no
# composer.json (no Composer dependencies), and often no package.json
# either (or one used purely for lint tooling, with no build or test
# script). There is no lightweight way to run a real WordPress instance in
# this job, so this archetype has no build-equivalent check here beyond the
# manifest excuse; accessibility.yml separately gives it an honest no-op
# for the same reason (no live render available in CI). First introduced as
# a project-local fix in Tim Dixon WordPress Theme and LLBS-Website.

name: CI
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # --- Static front-end: HTML, CSS, JavaScript ---
      - name: Set up Node.js
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies (npm)
        if: hashFiles('package.json') != ''
        run: npm ci

      - name: Install Playwright browsers
        # Gated on a Playwright config file, not a remembered flag: any
        # project that adds one gets the browser install for free, whether
        # Playwright runs from the default "test" script or a separate one.
        if: hashFiles('playwright.config.js', 'playwright.config.ts', 'playwright.config.mjs') != ''
        run: npx playwright install --with-deps

      - name: Build (npm)
        # --if-present no-ops when the project has no "build" script, for
        # a small static project that needs no bundler. Runs before the
        # test step because some projects' test suites (Playwright-based
        # archetype-C projects in particular) load the built output, not
        # the source tree, so the build must exist before tests run. This
        # ordering is unconditional across every archetype: it costs
        # nothing where tests don't need the build (Vitest reads source
        # modules directly) and is required where they do.
        if: hashFiles('package.json') != ''
        run: npm run build --if-present

      - name: Run unit tests (npm)
        # --if-present no-ops when the project has no "test" script, so a
        # static-content or not-yet-tested project does not fail the build
        # for lacking one. The paired warning step below keeps the gap
        # visible in the log without gating the merge.
        if: hashFiles('package.json') != ''
        run: npm run test --if-present

      - name: Warn if no test script is present (npm)
        # Non-blocking by design: always exits 0. Surfaces the gap in the
        # log so an untested project is not silently green.
        if: hashFiles('package.json') != ''
        run: |
          if ! node -e "process.exit(require('./package.json').scripts && require('./package.json').scripts.test ? 0 : 1)"; then
            echo "::warning::No \"test\" script found in package.json. Unit tests did not run for this project."
          fi

      # --- Project-specific: dependency-free app tests (kept from the project's own ci.yml) ---
      # This repository has no root package.json, so the tests run as plain
      # node scripts. Merged by hand; ci.yml is listed in .claude/workflows-protect.
      - name: Set up Node.js for dependency-free app tests
        if: hashFiles('package.json') == ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '22'

      - name: Verify emotion data and backup compatibility
        run: node tests/context-analysis.cjs

      - name: Verify release notice, Help and data-update readiness
        run: node tests/release-readiness.cjs

      - name: Verify independent capture settings and record saves
        run: node tests/capture-options.cjs

      - name: Verify calendar-day logging streaks
        run: node tests/logging-streak.cjs

      - name: Verify optional Google Drive transport
        run: node tests/google-drive.cjs

      - name: Verify optional Google Drive controls
        run: node tests/google-drive-ui.cjs

      - name: Verify shared dataset list reconciliation
        run: node tests/shared-dataset-list.cjs

      - name: Verify shared dataset review
        run: node tests/review-datasets.cjs

      - name: Two-way sync reconciliation
        run: node tests/google-drive-sync.cjs

      # --- PHP with MariaDB, and WordPress ---
      # Both stacks use the same Composer scripts, defined in each
      # project's composer.json per docs/stacks/php-mariadb.md and
      # docs/stacks/wordpress.md.
      - name: Set up PHP
        if: hashFiles('composer.json') != ''
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962  # v2.40.0
        with:
          php-version: '8.3'

      - name: Install dependencies (Composer)
        if: hashFiles('composer.json') != ''
        run: composer install --prefer-dist --no-interaction

      - name: Static analysis (composer analyse)
        if: hashFiles('composer.json') != ''
        run: composer analyse

      - name: Unit tests (composer test)
        if: hashFiles('composer.json') != ''
        run: composer test

      # WordPress integration and end-to-end suites (composer
      # test:integration, composer test:e2e) need a running WordPress
      # instance via wp-env and belong in a dedicated job once a WordPress
      # project reaches that point. See docs/stacks/wordpress.md.

      - name: Check for a static-content, python-tool, or wordpress-theme archetype declaration
        # Reads .github/ci-archetype, trimmed of surrounding whitespace and
        # newlines, and records whether it declares "static-content",
        # "python-tool", or "wordpress-theme". Runs unconditionally (cheap)
        # so the fail-check below can read the result regardless of which
        # manifests are present.
        id: archetype
        run: |
          if [ -f .github/ci-archetype ]; then
            value=$(tr -d '[:space:]' < .github/ci-archetype)
          else
            value=""
          fi
          if [ "$value" = "static-content" ]; then
            echo "is_static_content=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_static_content=false" >> "$GITHUB_OUTPUT"
          fi
          if [ "$value" = "python-tool" ]; then
            echo "is_python_tool=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_python_tool=false" >> "$GITHUB_OUTPUT"
          fi
          if [ "$value" = "wordpress-theme" ]; then
            echo "is_wordpress_theme=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_wordpress_theme=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fail if no manifest or excusing declaration was found
        if: |
          hashFiles('package.json') == '' &&
          hashFiles('composer.json') == '' &&
          steps.archetype.outputs.is_static_content != 'true' &&
          steps.archetype.outputs.is_python_tool != 'true' &&
          steps.archetype.outputs.is_wordpress_theme != 'true'
        run: |
          echo "No package.json or composer.json found at the repository root,"
          echo "and .github/ci-archetype does not declare \"static-content\","
          echo "\"python-tool\", or \"wordpress-theme\". This is a code-type"
          echo "project, so one of these is expected. See the comments at the"
          echo "top of this workflow for what each manifest or declaration means."
          exit 1

      # --- Python command-line tool or automation script ---
      - name: Set up Python
        if: steps.archetype.outputs.is_python_tool == 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.x'

      - name: Compile check (python-tool)
        # python3 -m compileall is the substantive build-equivalent gate for
        # this archetype: there is no bundler or test runner to invoke, but
        # a script that fails to compile is a real defect this check
        # catches. Runs against the whole repository tree, excluding common
        # non-source directories.
        if: steps.archetype.outputs.is_python_tool == 'true'
        run: |
          python3 -m compileall -q \
            -x '(^\./\.git/|^\./node_modules/|^\./\.claude/)' \
            .
