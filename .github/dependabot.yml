# Dependabot configuration.
# Weekly, grouped dependency updates. No root manifest, so only the CI tools and the workflows are watched.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /ci-tools/accessibility-tools
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      accessibility-tools:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /ci-tools/lint-tools
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      lint-tools:
        patterns: ["*"]
